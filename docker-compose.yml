services:
  mysql:
    image: mysql:8.0
    container_name: cbm-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-your_db_password}
      MYSQL_DATABASE: ${DB_NAME:-crossborder_mall}
    ports:
      - "3306:3306"
    volumes:
      - ./crossborder-mall-backend/src/main/resources/db/crossborder_mall.sql:/docker-entrypoint-initdb.d/01-crossborder_mall.sql:ro
      - ./crossborder-mall-backend/src/main/resources/db/cb_mall_commerce.sql:/docker-entrypoint-initdb.d/02-cb_mall_commerce.sql:ro
      - ./crossborder-mall-backend/src/main/resources/db/cb_mall_trade.sql:/docker-entrypoint-initdb.d/03-cb_mall_trade.sql:ro
      - ./crossborder-mall-backend/src/main/resources/db/cb_mall_seckill.sql:/docker-entrypoint-initdb.d/04-cb_mall_seckill.sql:ro
      - ./crossborder-mall-backend/src/main/resources/db/cb_mall_drop_legacy.sql:/docker-entrypoint-initdb.d/05-cb_mall_drop_legacy.sql:ro
      - cbm-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_PASSWORD:-your_db_password}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4
    container_name: cbm-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-your_redis_password}"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-your_redis_password}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: cbm-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./crossborder-mall-backend
    container_name: cbm-backend
    env_file: .env
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      SERVER_PORT: 8081
    ports:
      - "${BACKEND_PORT:-8081}:8081"
    volumes:
      - cbm-uploads:/data/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  frontend:
    build: ./crossborder-mall-frontend
    container_name: cbm-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend

volumes:
  cbm-mysql-data:
  cbm-uploads:
